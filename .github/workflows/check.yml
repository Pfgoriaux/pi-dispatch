name: Check
# CI runs on the self-hosted runner (ci-runner, arm64): GitHub-hosted minutes are not used.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
